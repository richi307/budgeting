<!DOCTYPE html>
<html lang="it">
<head>

<style>
:root{--bg:#e9eaee;--card:#f8f8fa;--ink:#0f1114;--mute:#6a707b;--line:rgba(15,17,20,.08);--dark:#f8f8fa;--bn:#3d6bff;--bs:#ff4d2e;--acc:#ff4d2e;--n:#3d6bff;--s:#bd6f00;--r:#0f9a5e;--bad:#e5322d;--glass:rgba(248,248,250,.5);--hi:rgba(255,255,255,.75);--btn:#0f1114;--btnt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c0e;--card:#17181c;--ink:#f3f4f6;--mute:#8b909b;--line:rgba(255,255,255,.09);--dark:#24262b;--bn:color-mix(in srgb,#7a98ff 55%,transparent);--bs:color-mix(in srgb,#ff4d2e 85%,transparent);--n:#7a98ff;--s:#ffb92e;--r:#2dd18a;--bad:#ff6b66;--glass:rgba(40,43,50,.5);--hi:rgba(255,255,255,.18);--btn:#f3f4f6;--btnt:#0f1114}}
:root[data-theme="dark"]{--bg:#0b0c0e;--card:#17181c;--ink:#f3f4f6;--mute:#8b909b;--line:rgba(255,255,255,.09);--dark:#24262b;--bn:color-mix(in srgb,#7a98ff 55%,transparent);--bs:color-mix(in srgb,#ff4d2e 85%,transparent);--n:#7a98ff;--s:#ffb92e;--r:#2dd18a;--bad:#ff6b66;--glass:rgba(40,43,50,.5);--hi:rgba(255,255,255,.18);--btn:#f3f4f6;--btnt:#0f1114}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:30px;font-weight:800;margin:0;letter-spacing:-.03em;line-height:1.1}.big{font-size:46px}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin:6px 4px 16px}
.gear{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center}.gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.card{background:var(--card);border-radius:28px;padding:18px;margin-bottom:14px}
.mute{color:var(--mute);font-size:13px}.bad{color:var(--bad)}.pos{color:var(--r);font-weight:700}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:0;border-radius:16px;padding:12px 14px;width:100%}
:focus-visible{outline:2px solid var(--n);outline-offset:2px}
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:999px;font-weight:600;color:var(--mute)}.seg .on{background:var(--btn);color:var(--btnt)}
.amtbox{display:flex;align-items:baseline;gap:6px;padding:0 4px}.amtbox span{font-size:34px;font-weight:600;color:var(--mute)}
#amt{font-size:64px;font-weight:800;background:none;padding:0;letter-spacing:-.04em;border-radius:0}
.dev{background:var(--dark);color:var(--ink);border-radius:34px;padding:12px 16px 14px;margin:12px 0}
.wv{position:relative}.band{position:absolute;left:0;right:0;top:88px;height:44px;border-radius:22px;pointer-events:none;transition:background .2s}
.band.n{background:var(--bn)}.band.s{background:var(--bs)}
.wheel{height:220px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;position:relative;-webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent)}
.wheel::-webkit-scrollbar{display:none}.wp{height:88px}
.wi{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:19px;font-weight:600;opacity:.45;cursor:pointer}.wi.on{opacity:1;font-size:24px;font-weight:800;color:#fff}
.hint{text-align:center;font-size:13px;opacity:.75;margin-top:8px;min-height:20px}
.row2{display:flex;gap:10px;margin-bottom:12px}
.dchip{position:relative;flex:none;display:grid;place-items:center;padding:0 20px;border-radius:16px;background:var(--card);font-weight:700}.dchip input{position:absolute;inset:0;opacity:0;width:100%}
.add{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:var(--r);color:#fff;font-size:44px;font-weight:600;line-height:1;margin:0 auto 22px;box-shadow:0 8px 20px color-mix(in srgb,var(--r) 40%,transparent)}
.add:active{transform:scale(.94)}
.go{width:100%;padding:14px;border-radius:999px;background:var(--btn);color:var(--btnt);font-weight:700;font-size:16px}.go.sec{background:var(--bg);color:var(--ink)}
.br{margin-bottom:12px}.rw{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}.rw i{font-style:normal;color:var(--mute);font-weight:400}
.tr{height:10px;border-radius:10px;background:var(--bg);overflow:hidden}.fl{height:100%;border-radius:10px}
.fl.nec{background:var(--n)}.fl.sva{background:var(--s)}.fl.ris{background:var(--r)}.fl.bd{background:var(--bad)}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.li:first-of-type{border-top:0}.li .g{flex:1;min-width:0}.li .x{color:var(--mute);padding:4px 8px}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}.chip{padding:8px 18px;border-radius:999px;background:var(--card);font-weight:700}.chip.on{background:var(--btn);color:var(--btnt)}
.lg{display:flex;gap:14px;margin:0 4px 10px;font-size:13px;font-weight:600}.lg .n{color:var(--n)}.lg .s{color:var(--s)}.lg .r{color:var(--r)}
.mrow{display:block;width:100%;text-align:left;background:var(--card);border-radius:24px;padding:14px;margin-bottom:10px}.mrow.emp{opacity:.55}
.mh{display:flex;justify-content:space-between;margin-bottom:8px}.ps{display:flex;gap:6px}
.pill{flex:1;padding:8px 4px;border-radius:14px;text-align:center;font-size:13px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.pill.n{--c:var(--n)}.pill.s{--c:var(--s)}.pill.r{--c:var(--r)}.pill.bd{background:var(--bad);color:#fff}
.kv{display:flex;justify-content:space-between;align-items:center;padding:8px 0;gap:12px}.kv b{font-weight:700}.kv input{width:130px;text-align:right}
.sub{font-size:12px;color:var(--mute);margin:-4px 0 6px}
.split{display:flex;gap:4px;height:22px;margin:4px 4px 10px}.split i{border-radius:11px;min-width:6px}
.leg{display:flex;justify-content:space-between;margin:0 4px 16px;font-size:13px;font-weight:600}.leg b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.more{display:block;width:100%;padding:14px;border-radius:999px;background:var(--card);font-weight:700;margin-bottom:14px}
.back{color:var(--n);font-weight:700;padding:4px 4px 10px}
.ch{width:100%;height:auto}.ln{fill:none;stroke:var(--r);stroke-width:3;stroke-linejoin:round}.dt{fill:var(--r)}.cl{stroke:var(--mute);stroke-dasharray:4 4;stroke-width:1.2}.tx{fill:var(--mute);font-size:11px}
#tabs{position:fixed;left:14px;right:14px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:492px;margin:0 auto;display:flex;gap:0;padding:6px 4px;border-radius:34px;background:var(--glass);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);border:1px solid var(--hi);box-shadow:0 10px 30px rgba(0,0,0,.14),inset 0 1px 0 var(--hi)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:28px;font-size:10px;letter-spacing:-.01em;min-width:0;font-weight:700;color:var(--mute)}
.tb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tb.on{color:var(--ink);background:var(--hi);box-shadow:inset 0 0 0 1px var(--hi),0 2px 8px rgba(0,0,0,.08)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnt);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:30}
.top{min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 30px - 70px);display:flex;flex-direction:column;justify-content:space-between}.top .add{margin-bottom:26px}
body::before{content:"";position:fixed;inset:0 0 auto;height:calc(env(safe-area-inset-top,0px) + 14px);background:linear-gradient(var(--bg) calc(100% - 14px),transparent);z-index:20;pointer-events:none}
main{padding-top:30px}
button{transition:transform .25s cubic-bezier(.2,.8,.2,1),background-color .2s,opacity .2s}button:active{transform:scale(.95)}
.add{width:100%;height:60px;border-radius:30px;font-size:18px;font-weight:800;line-height:1;padding:0}
html.snap{scroll-snap-type:y mandatory}
.top{scroll-snap-align:start;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 30px);will-change:transform,opacity}
.below{scroll-snap-align:start;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 16px);min-height:calc(100svh - env(safe-area-inset-top,0px) - 16px);padding-top:8px;opacity:0;will-change:transform,opacity}
.ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:28px;background:var(--hi);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 1px var(--hi),0 4px 14px rgba(0,0,0,.1);backdrop-filter:blur(8px) saturate(170%);-webkit-backdrop-filter:blur(8px) saturate(170%);opacity:0;pointer-events:none}
.ind.rdy{transition:transform .55s cubic-bezier(.3,1.35,.5,1),width .55s cubic-bezier(.3,1.35,.5,1),opacity .2s}
.tb{position:relative;z-index:1}.tb.on{background:none;box-shadow:none}.tb.on svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.pgin{animation:pgin .45s cubic-bezier(.22,1,.36,1)}
.fl{transform-origin:left;animation:grow .8s cubic-bezier(.22,1,.36,1)}
.li{animation:rin .4s cubic-bezier(.22,1,.36,1) both}
.seg .on,.chip.on{animation:sel .35s cubic-bezier(.3,1.5,.5,1)}
.add.pp{animation:pp .5s cubic-bezier(.3,1.5,.5,1)}
#toast{animation:ti .5s cubic-bezier(.2,1.3,.3,1)}
.wi{transition:opacity .2s,font-size .18s}
@keyframes pop{from{transform:scale(.75)}}
@keyframes pgin{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rin{from{opacity:0;transform:translateY(8px)}}
@keyframes sel{from{transform:scale(.9)}}
@keyframes pp{40%{transform:scale(1.05)}}
@keyframes ti{from{opacity:0;transform:translate(-50%,-24px) scale(.9)}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="tabs"><i class="ind"></i>
<button class="tb" data-a="tab" data-t="oggi"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Oggi</button>
<button class="tb" data-a="tab" data-t="anno"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Overview</button>
<button class="tb" data-a="tab" data-t="pat"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 9 9h-9z"/></svg>Patrimonio</button>
<button class="tb" data-a="tab" data-t="inv"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/></svg>Investimenti</button>
<button class="tb" data-a="tab" data-t="imp"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>Impostazioni</button>
</nav>
<script>
const CATS={nec:['Affitto','Spesa','Bollette','Trasporti','Telefono','Altro'],sva:['Ristorante','Viaggi','Shopping','Palestra','Abbonamenti']};
const ALL=[...CATS.nec,...CATS.sva],NOTE=['Affitto','Spesa','Bollette','Trasporti','Telefono','Altro','Ristorante','Viaggi','Shopping','Palestra','Abbonamenti'];
const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const DEF=()=>({base:0,tx:[],inc:[],ev:[]});
function mig(o){const r=Object.assign(DEF(),o);if(r.salary!==undefined||r.inv||r.years||r.liq){let n=0;Object.keys(r.inv||{}).forEach(k=>r.ev.push({id:Date.now()+n++,t:'val',d:k+'-28',v:r.inv[k]}));if(r.cap>0)r.ev.push({id:1,t:'buy',d:'2000-01-01',a:r.cap,nl:1});
const k=Object.keys(r.years||{}).filter(y=>r.years[y].liq!=null).sort()[0];if(k)r.base=r.years[k].liq;else if(r.liq)r.base=r.liq;['salary','cap','liq','inv','years'].forEach(k=>delete r[k])}return r}
let S=DEF();try{const j=localStorage.getItem('spese-v1');if(j)S=mig(JSON.parse(j))}catch(e){}
const save=()=>{try{localStorage.setItem('spese-v1',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const eur=n=>(Math.round(n*100)/100).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const cy=()=>new Date().getFullYear();
const num=s=>{const p=String(s).replace(/\s/g,'').replace(/,/g,'.').split('+').map(parseFloat);return p.some(isNaN)?NaN:Math.round(p.reduce((a,b)=>a+b,0)*100)/100};
const lab=k=>MESI[+k.slice(5)-1].slice(0,3)+' '+k.slice(2,4),dfmt=d=>`${d.slice(8)}/${d.slice(5,7)}/${d.slice(0,4)}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='oggi',Y=cy(),PY=cy(),ANIM=false,POP=false,M=null,RO=false,RS=false,CP='',PD=false,F={t:'spesa',c:'Spesa',d:today(),a:'',n:''},G={f:'val',a:'',d:today(),nl:false,m:'eur',v:'',vd:today()};
function weeks(y,m){const dim=new Date(y,m+1,0).getDate(),r=[];let s=1;for(let d=1;d<=dim;d++){if(new Date(y,m,d).getDay()==0||d==dim){r.push({s,e:d});s=d+1}}return r}
const wl=w=>w.s==w.e?`${w.s}`:`${w.s}–${w.e}`,wi=(ws,d)=>ws.findIndex(w=>d>=w.s&&d<=w.e);
function st(y,m){const p=`${y}-${pad(m+1)}`,T=S.tx.filter(t=>t.d.startsWith(p)),I=S.inc.filter(t=>t.d.startsWith(p)),by={},ws=weeks(y,m),w=ws.map(()=>0);
ALL.forEach(c=>by[c]=0);T.forEach(t=>{by[t.c]+=t.a;if(t.c=='Spesa'||t.c=='Ristorante')w[wi(ws,+t.d.slice(8))]+=t.a});
const sum=a=>a.reduce((s,c)=>s+by[c],0),ent=I.reduce((s,t)=>s+t.a,0),nec=sum(CATS.nec),sva=sum(CATS.sva);
return{T,I,by,ws,w,ent,nec,sva,ris:ent-nec-sva,has:T.length+I.length>0}}
const bad=s=>({nec:s.ent>0&&s.nec>s.ent*.5+.005,sva:s.ent>0&&s.sva>s.ent*.3+.005,ris:s.ent>0&&s.ris<s.ent*.2-.005});
const bar=(k,l,v,t,b)=>`<div class="br"><div class="rw"><span>${l}</span><b class="${b?'bad':''}">${eur(v)} <i>/ ${eur(t)}</i></b></div><div class="tr"><div class="fl ${k} ${b?'bd':''}" style="width:${t>0?Math.max(0,Math.min(100,v/t*100)):0}%"></div></div></div>`;
const bars=s=>{const b=bad(s);return (s.ent>0?'':`<p class="mute">Aggiungi le entrate del mese per calcolare gli obiettivi.</p>`)+bar('nec','Necessità 50%',s.nec,s.ent*.5,b.nec)+bar('sva','Svago 30%',s.sva,s.ent*.3,b.sva)+bar('ris','Risparmi 20%',s.ris,s.ent*.2,b.ris)};
const items=s=>[...s.T.map(t=>({...t,k:'tx'})),...s.I.map(t=>({...t,k:'inc',c:'Entrata'}))].sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
const list=arr=>arr.length?arr.map(t=>`<div class="li"><div class="g"><div>${t.c}${t.n?` <span class="mute">${esc(t.n)}</span>`:''}</div><div class="mute">${t.d.slice(8)}/${t.d.slice(5,7)}</div></div><b class="${t.k=='inc'?'pos':''}">${t.k=='inc'?'+':''}${eur(t.a)}</b><button class="x" aria-label="Elimina" data-a="del" data-k="${t.k}" data-id="${t.id}">✕</button></div>`).join(''):`<p class="mute">Ancora nessun movimento.</p>`;
function replay(u){const ev=S.ev.slice().sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id);let cap=0,val=0;const pts=[];
for(const e of ev){if(u&&e.d>u)break;if(e.t=='buy'){cap+=e.a;val+=e.a}else val=e.pct!=null?cap*(1+e.pct/100):e.v;pts.push({e,cap,val})}return{cap,val,pts}}
/* anni: dal primo con spese/entrate fino a quello corrente */
function yrs(){const c=cy();let f=c;[...S.tx,...S.inc].forEach(x=>f=Math.min(f,+x.d.slice(0,4)));const r=[];for(let y=f;y<=c;y++)r.push(y);return r}
/* patrimonio: gli acquisti di investimenti scalano solo la liquidità pregressa */
function pat(y){y=y||cy();const e1=`${y}-12-31`;let past=0,cur=0;for(let k=yrs()[0];k<y;k++)for(let m=0;m<12;m++)past+=st(k,m).ris;for(let m=0;m<12;m++)cur+=st(y,m).ris;
const buys=S.ev.filter(e=>e.t=='buy'&&!e.nl&&e.d<=e1).reduce((s,e)=>s+e.a,0),preg=(S.base||0)+past-buys,r=replay(e1);return{preg,cur,liq:preg+cur,cap:r.cap,val:r.val,tot:preg+cur+r.val}}
/* stringa per le Note */
function note(y,m){const s=st(y,m),f=n=>Number(n.toFixed(2)).toString().replace('.',','),ex=a=>a.length?a.length==1?f(a[0]):a.map(f).join(' + ')+' = '+f(a.reduce((x,z)=>x+z,0)):'0';
const arr=(c,k)=>s.T.filter(t=>t.c==c&&(k==null||wi(s.ws,+t.d.slice(8))==k)).sort((a,b)=>a.d.localeCompare(b.d)).map(t=>t.a);
const o=[`${MESI[m].toUpperCase()}\n€ ${f(s.nec+s.sva)}`];NOTE.forEach(c=>o.push(`${c}\n${ex(arr(c))}`));
s.ws.forEach((w,i)=>o.push(`${wl(w).replace('–',' - ')} € ${f(s.w[i])}`,`Spesa\n${ex(arr('Spesa',i))}`,`Ristorante\n${ex(arr('Ristorante',i))}`));return o.join('\n\n')}
const gname=c=>CATS.nec.includes(c)?'Necessità':'Svago';
const hintTxt=()=>{if(F.t!='spesa')return '';const y=+F.d.slice(0,4),m=+F.d.slice(5,7)-1,s=st(y,m),k=wi(s.ws,+F.d.slice(8));return gname(F.c)+((F.c=='Spesa'||F.c=='Ristorante')&&k>=0?` · Spesa + Ristorante ${wl(s.ws[k])} ${MESI[m].slice(0,3).toLowerCase()}: ${eur(s.w[k])}`:'')};
const dl=d=>d==today()?'Oggi':`${+d.slice(8)} ${MESI[+d.slice(5,7)-1].slice(0,3).toLowerCase()}`;
function vOggi(){const n=new Date(),s=st(n.getFullYear(),n.getMonth()),sp=F.t=='spesa';
return `<div class="top"><header class="hd"><div class="mute" style="font-size:15px;font-weight:600">${MESI[n.getMonth()]} ${n.getFullYear()}</div></header>
<div class="seg"><button class="${sp?'on':''}" data-a="t" data-v="spesa">Spesa</button><button class="${sp?'':'on'}" data-a="t" data-v="entrata">Entrata</button></div>
<div class="amtbox"><span>€</span><input id="amt" inputmode="decimal" placeholder="0" value="${esc(F.a)}" aria-label="Importo"></div><div class="mute" id="pv" style="padding:0 4px;min-height:20px"></div>
${sp?`<div class="dev"><div class="wv"><div class="band ${CATS.nec.includes(F.c)?'n':'s'}" id="band"></div><div class="wheel" id="wh"><div class="wp"></div>${ALL.map(c=>`<div class="wi ${c==F.c?'on':''}">${c}</div>`).join('')}<div class="wp"></div></div></div><div class="hint" id="hint">${esc(hintTxt())}</div></div>`:'<div style="height:12px"></div>'}
<div class="row2"><label class="dchip"><span id="dl">${dl(F.d)}</span><input id="dt" type="date" max="${today()}" value="${F.d}" aria-label="Data"></label><input id="nt" placeholder="Nota (facoltativa)" value="${esc(F.n)}"></div>
<button class="add" data-a="add">Aggiungi</button>
</div><div class="below"><div class="card"><h2>Obiettivi del mese</h2>${bars(s)}<div class="kv"><span class="mute">Entrate</span><b>${eur(s.ent)}</b></div></div>
<div class="card"><h2>Ultimi movimenti</h2>${list(items(s).slice(0,4))}</div></div>`}
function vAnno(){const ys=yrs(),t=[0,0,0];
const rows=MESI.map((m,i)=>{const s=st(Y,i),b=bad(s);t[0]+=s.ent;t[1]+=s.nec+s.sva;t[2]+=s.ris;return `<button class="mrow ${s.has?'':'emp'}" data-a="mese" data-m="${i}"><div class="mh"><b>${m}</b><span class="mute">Entrate ${eur(s.ent)}</span></div><div class="ps"><span class="pill n ${b.nec?'bd':''}">${eur(s.nec)}</span><span class="pill s ${b.sva?'bd':''}">${eur(s.sva)}</span><span class="pill r ${b.ris?'bd':''}">${eur(s.ris)}</span></div></button>`}).join('');
return `<header class="hd"><h1>${Y}</h1></header>${ys.length>1?`<div class="chips">${ys.slice().reverse().map(y=>`<button class="chip ${y==Y?'on':''}" data-a="yr" data-y="${y}">${y}</button>`).join('')}</div>`:''}
<div class="lg"><span class="n">● Necessità</span><span class="s">● Svago</span><span class="r">● Risparmi</span></div>${rows}
<div class="card"><h2>Totale ${Y}</h2><div class="kv"><span>Entrate</span><b>${eur(t[0])}</b></div><div class="kv"><span>Spese</span><b>${eur(t[1])}</b></div><div class="kv"><span>Risparmi</span><b class="pos">${eur(t[2])}</b></div></div>`}
function vMese(){const s=st(Y,M),mm=MESI[M].slice(0,3).toLowerCase();
return `<button class="back" data-a="back">‹ ${Y}</button><header class="hd"><h1>${MESI[M]}</h1></header>

<div class="card">${bars(s)}<div class="kv"><span class="mute">Entrate</span><b>${eur(s.ent)}</b></div></div>
<div class="card"><h2>Per categoria</h2>${NOTE.map(c=>`<div class="kv"><span>${c}</span><b>${eur(s.by[c])}</b></div>`).join('')}</div>
<div class="card"><h2>Movimenti</h2>${list(items(s))}</div>
<div class="card"><h2>Spesa + Ristorante a settimana</h2>${s.ws.map((w,i)=>`<div class="kv"><span>${wl(w)} ${mm}</span><b>${eur(s.w[i])}</b></div>`).join('')}</div>
<button class="go" data-a="note">Copia come nota</button>${CP?`<textarea readonly rows="8" style="margin-top:14px">${esc(CP)}</textarea>`:''}`}
function vPat(){const ys=yrs(),p=pat(PY);const tot=Math.max(p.liq,0)+Math.max(p.val,0)||1;
return `${ys.length>1?`<div class="chips">${ys.slice().reverse().map(y=>`<button class="chip ${y==PY?'on':''}" data-a="py" data-y="${y}">${y}</button>`).join('')}</div>`:''}<header class="hd"><div><div class="mute">${PY==cy()?'Patrimonio totale':'Patrimonio a fine '+PY}</div><h1 class="big" data-v="${p.tot}">${eur(p.tot)}</h1></div></header>
<div class="split"><i style="flex:${Math.max(p.liq,0)/tot+.001};background:var(--n)"></i><i style="flex:${Math.max(p.val,0)/tot+.001};background:var(--r)"></i></div>
<div class="leg"><span><b style="background:var(--n)"></b>Liquidità ${eur(p.liq)}</span><span><b style="background:var(--r)"></b>Investimenti ${eur(p.val)}</span></div>
<div class="card"><div class="kv"><span>Liquidità iniziale</span><b>${eur(p.preg)}</b></div>
<div class="kv"><span>Liquidità totale</span><b>${eur(p.liq)}</b></div>
<div class="kv"><span>Capitale investito</span><b>${eur(p.cap)}</b></div>
<button class="kv" style="width:100%;text-align:left" data-a="tab" data-t="inv"><span>${PY==cy()?'Valore investimento attuale':'Valore a fine '+PY} ›</span><b>${eur(p.val)}</b></button></div>`}
function chart(p){if(!p.length)return `<p class="mute">Aggiungi un acquisto o un aggiornamento per vedere il grafico.</p>`;
const all=p.flatMap(x=>[x.cap,x.val]);let lo=Math.min(...all),hi=Math.max(...all);if(hi==lo){hi+=1;lo-=1}const q=(hi-lo)*.15;lo-=q;hi+=q;
const W=320,H=150,X=i=>p.length<2?W/2:12+i*(W-24)/(p.length-1),Yy=y=>H-14-(y-lo)/(hi-lo)*(H-28),pl=k=>p.map((x,i)=>`${X(i)},${Yy(x[k])}`).join(' ');
return `<svg viewBox="0 0 ${W} ${H+16}" class="ch" role="img" aria-label="Andamento investimenti"><polyline points="${pl('cap')}" class="cl" fill="none"/><polyline points="${pl('val')}" class="ln"/>${p.map((x,i)=>`<circle cx="${X(i)}" cy="${Yy(x.val)}" r="3.5" class="dt"/>`).join('')}<text x="12" y="${H+12}" class="tx">${lab(p[0].e.d.slice(0,7))}</text><text x="${W-12}" y="${H+12}" text-anchor="end" class="tx">${lab(p[p.length-1].e.d.slice(0,7))}</text></svg><p class="mute">Linea piena: valore. Tratteggiata: capitale investito.</p>`}
function vInv(){const r=replay(),g=r.val-r.cap,pc=r.cap>0?(g/r.cap*100).toFixed(1).replace('.',','):'0',v=G.f=='val',sp=G.m=='pct';
return `<header class="hd"><div><div class="mute">Investimenti</div><h1 class="big" data-v="${r.val}">${eur(r.val)}</h1></div></header>
<p class="mute" style="margin:-8px 4px 14px">Capitale ${eur(r.cap)} · <b class="${g<0?'bad':'pos'}">${g>0?'+':''}${eur(g)} (${pc}%)</b></p>
<div class="card">${chart(r.pts)}</div>
<div class="seg"><button class="${v?'on':''}" data-a="fm" data-v="val">Aggiorna valore</button><button class="${v?'':'on'}" data-a="fm" data-v="buy">Nuovo acquisto</button></div>
${v?`<div class="card"><div class="row2"><input id="vv" inputmode="decimal" placeholder="${sp?'Rendimento, es. 5,2':'€ valore totale'}" value="${esc(G.v)}" aria-label="Valore"><input id="vd" type="date" max="${today()}" value="${G.vd}" aria-label="Data" style="width:150px"></div><div class="mute" id="vp" style="margin-bottom:10px;min-height:18px"></div><button class="go" data-a="val">Salva aggiornamento</button></div>`
:`<div class="card"><div class="row2"><input id="ba" inputmode="decimal" placeholder="€ importo" value="${esc(G.a)}" aria-label="Importo"><input id="bdt" type="date" max="${today()}" value="${G.d}" aria-label="Data" style="width:150px"></div>
<label class="mute" style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><input id="bn" type="checkbox" style="width:auto" ${G.nl?'checked':''}>Già investito prima: non scalare dalla liquidità</label><button class="go" data-a="buy">Aggiungi acquisto</button></div>`}
<div class="card"><h2>Storico</h2>${r.pts.length?r.pts.slice().reverse().map(({e,cap,val})=>`<div class="li"><div class="g"><div>${e.t=='buy'?'Acquisto'+(e.nl?' precedente':''):'Aggiornamento'}</div><div class="mute">${dfmt(e.d)}${e.t=='val'&&cap>0?` · ${((val-cap)/cap*100).toFixed(1).replace('.',',')}%`:''}</div></div><b>${e.t=='buy'?'+'+eur(e.a):eur(val)}</b><button class="x" aria-label="Elimina" data-a="edel" data-id="${e.id}">✕</button></div>`).join(''):`<p class="mute">Vuoto.</p>`}</div>`}
function vImp(){return `<header class="hd"><h1>Impostazioni</h1></header>
<div class="card"><h2>Liquidità di partenza</h2><p class="mute">La liquidità che avevi prima di iniziare a usare l’app. Si inserisce una sola volta, al primo utilizzo.</p><input id="base" inputmode="decimal" value="${S.base||0}" aria-label="Liquidità di partenza"></div>
<div class="card"><h2>Backup dei dati</h2><p class="mute">I dati sono salvati solo su questo dispositivo. Salva copia una stringa da conservare, per esempio in Note.</p><button class="go" data-a="bsave">Salva</button><div style="height:10px"></div><button class="go sec" data-a="brest">Ripristina</button>
${RO?`<div style="height:10px"></div><textarea id="bk" rows="4" placeholder="Incolla qui la stringa salvata"></textarea><div style="height:10px"></div><button class="go" data-a="bgo">Conferma ripristino</button>`:''}
${CP?`<p class="mute">Copia non riuscita: seleziona e copia a mano.</p><textarea readonly rows="3">${esc(CP)}</textarea>`:''}</div>
<div class="card"><h2>Azzera</h2><p class="mute">Cancella spese, entrate e investimenti da questo dispositivo. Fai prima un backup.</p><button class="go sec" data-a="rst" style="color:var(--bad)">${RS?'Tocca ancora per cancellare tutto':'Cancella tutti i dati'}</button></div>`}
const enc=()=>btoa(unescape(encodeURIComponent(JSON.stringify(S))));
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(x){return false}}}
function toast(m){const e=document.createElement('div');e.id='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>{e.style.transition='opacity .3s,transform .3s';e.style.opacity=0;e.style.transform='translateX(-50%) translateY(-10px)'},1500);setTimeout(()=>e.remove(),1850)}
function initWheel(){const w=$('#wh');if(!w)return;const it=[...w.querySelectorAll('.wi')];w.style.scrollBehavior='auto';w.scrollTop=ALL.indexOf(F.c)*44;let raf;
w.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const i=Math.max(0,Math.min(ALL.length-1,Math.round(w.scrollTop/44)));if(ALL[i]!=F.c){F.c=ALL[i];it.forEach((x,j)=>x.classList.toggle('on',j==i));$('#band').className='band '+(CATS.nec.includes(F.c)?'n':'s');$('#hint').textContent=hintTxt()}})});
it.forEach((x,i)=>x.onclick=()=>{w.style.scrollBehavior='smooth';w.scrollTo({top:i*44})})}
function pos(){const nb=document.querySelector('.tb.on'),i=$('#tabs .ind');if(!i)return;if(nb){i.style.opacity=1;i.style.width=nb.offsetWidth+'px';i.style.transform=`translateX(${nb.offsetLeft}px)`}else i.style.opacity=0}
let tk=0;function pg(){const t=$('.top'),b=$('.below');if(!t||!b)return;const mx=b.offsetTop-16,p=Math.max(0,Math.min(1,mx>0?scrollY/mx:0)),q=Math.max(0,Math.min(1,(p-.25)/.75));
t.style.opacity=1-Math.min(1,p*1.3);t.style.transform=`translateY(${-p*30}px) scale(${1-.06*p})`;t.style.pointerEvents=p>.5?'none':'';
b.style.opacity=q;b.style.transform=`translateY(${(1-q)*50}px) scale(${.96+.04*q})`;b.style.pointerEvents=q<.5?'none':''}
function countUp(){document.querySelectorAll('.big[data-v]').forEach(e=>{const v=+e.dataset.v,t0=performance.now(),f=n=>{const k=Math.min(1,(n-t0)/700);e.textContent=eur(v*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function render(){const v=tab=='anno'&&M!==null?vMese():({oggi:vOggi,anno:vAnno,pat:vPat,inv:vInv,imp:vImp})[tab](),app=$('#app');app.innerHTML=v;
document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));document.documentElement.classList.toggle('snap',tab=='oggi');
pos();initWheel();pg();
if(ANIM){app.classList.remove('pgin');void app.offsetWidth;app.classList.add('pgin');ANIM=false}
if(POP){const a=$('.add');if(a){a.classList.remove('pp');void a.offsetWidth;a.classList.add('pp')}POP=false}
requestAnimationFrame(()=>$('#tabs .ind').classList.add('rdy'))}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,d=el.dataset;if(a!='bsave'&&a!='note')CP='';if(a!='rst')RS=false;if(['tab','mese','back','yr','py'].includes(a))ANIM=true;
if(a=='tab'){tab=d.t;M=d.t=='anno'?new Date().getMonth():null;if(d.t=='anno')Y=cy();if(d.t=='pat')PY=cy();RO=false;scrollTo(0,0)}
else if(a=='t')F.t=d.v;
else if(a=='add'){const v=num(F.a);if(!(v>0)){toast('Inserisci un importo');return}
 if(F.t=='spesa')S.tx.push({id:Date.now(),d:F.d,c:F.c,a:v,n:F.n.trim()});else S.inc.push({id:Date.now(),d:F.d,a:v,n:F.n.trim()});
 save();F.a='';F.n='';toast(F.t=='spesa'?'Spesa aggiunta':'Entrata aggiunta');POP=true}
else if(a=='del'){S[d.k]=S[d.k].filter(x=>x.id!=d.id);save()}
else if(a=='mese'){M=+d.m;scrollTo(0,0)}
else if(a=='back')M=null;
else if(a=='yr'){Y=+d.y;M=null}
else if(a=='py')PY=+d.y;
else if(a=='note'){copy(note(Y,M)).then(ok=>{if(ok)toast('Nota copiata');else{CP=note(Y,M);render()}});return}
else if(a=='pd')PD=!PD;
else if(a=='fm')G.f=d.v;else if(a=='vm')G.m=d.v;
else if(a=='buy'){const v=num(G.a);if(!(v>0)){toast('Inserisci un importo');return}S.ev.push({id:Date.now(),t:'buy',d:G.d,a:v,nl:G.nl?1:0});save();G.a='';toast('Acquisto aggiunto')}
else if(a=='val'){const v=num(G.v);if(isNaN(v)||(G.m=='eur'&&v<0)){toast('Controlla il valore');return}S.ev.push(G.m=='pct'?{id:Date.now(),t:'val',d:G.vd,pct:v}:{id:Date.now(),t:'val',d:G.vd,v});save();G.v='';toast('Valore aggiornato')}
else if(a=='edel'){S.ev=S.ev.filter(x=>x.id!=d.id);save()}
else if(a=='bsave'){copy(enc()).then(ok=>{if(ok)toast('Stringa copiata');else{CP=enc();render()}});return}
else if(a=='brest')RO=!RO;
else if(a=='rst'){if(!RS)RS=true;else{S=DEF();save();RS=false;G.f='val';toast('Dati cancellati')}}
else if(a=='bgo'){try{const s=$('#bk').value.trim();let o;try{o=JSON.parse(decodeURIComponent(escape(atob(s))))}catch(x){o=JSON.parse(s)}S=mig(o);save();RO=false;toast('Dati ripristinati')}catch(x){toast('Stringa non valida');return}}
render()});
document.addEventListener('input',e=>{const t=e.target,v=t.value;
if(t.id=='amt'){F.a=v;const n=num(v);$('#pv').textContent=v.includes('+')&&!isNaN(n)?'= '+eur(n):''}
else if(t.id=='nt')F.n=v;else if(t.id=='ba')G.a=v;
else if(t.id=='vv'){G.v=v;const n=num(v),c=replay().cap;$('#vp').textContent=!isNaN(n)&&G.m=='pct'?`Valore risultante: ${eur(c*(1+n/100))} su ${eur(c)} investiti`:''}});
document.addEventListener('change',e=>{const t=e.target;
if(t.id=='dt'){F.d=t.value||today();$('#dl').textContent=dl(F.d);const h=$('#hint');if(h)h.textContent=hintTxt()}
else if(t.id=='bdt')G.d=t.value||today();else if(t.id=='vd')G.vd=t.value||today();else if(t.id=='bn')G.nl=t.checked;
else if(t.id=='base'){const n=num(t.value);S.base=isNaN(n)?0:n;save();render()}});
addEventListener('scroll',()=>{cancelAnimationFrame(tk);tk=requestAnimationFrame(pg)},{passive:true});addEventListener('load',pos);addEventListener('resize',pos);
render();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
